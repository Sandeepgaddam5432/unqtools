name: CI

on:
  push:
    branches: [main, v6-template, v6.1-cleanup-gates, v6.2-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Lint + Test + Build + E2E Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (static export)
        run: npm run build

      - name: Generate route list
        run: node tests/gen-routes.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E — full gate suite (smoke + tools + axe + overflow + motion + CLS)
        run: npx playwright test
        timeout-minutes: 25

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install + Build
        run: |
          npm ci
          npm run build

      # Cloudflare Pages auto-deploys from main on push.
      # The wrangler.toml at repo root tells CF Pages to use out/ as the build output.
      # No explicit deploy step needed — CF Pages watches the repo.
