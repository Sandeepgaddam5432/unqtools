# Regenerates package-lock.json on the current branch.
# Repo is maintained via API pushes (no local npm), so CI does it.
name: Update lockfile

on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - .github/workflows/Update-lock-file.yml

permissions:
  contents: write

jobs:
  lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit and push lockfile
        run: |
          git config user.name "sandeep-agent"
          git config user.email "sandeepgaddam5432@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: regenerate package-lock.json (automated)"
          git push
